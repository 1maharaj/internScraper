[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-detector"
version = "0.1.0"
description = "Internship scam-detection pipeline for iFind"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "tldextract>=5.1",
    "python-Levenshtein>=0.25",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
db = [
    "pymongo>=4.7",
    "python-dotenv>=1.0",
]
api = [
    "fastapi>=0.110",
]
zero-shot = [
    "transformers>=4.40",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scam_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
